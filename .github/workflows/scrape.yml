name: Scrape

on:
  workflow_dispatch:
    inputs:
      main_urls:
        description: "Main URLs, comma-separated (leave empty to use main_urls.txt)"
        required: false
        default: ""
      how_many:
        description: "How many items per main URL"
        required: false
        default: "500"
  # Uncomment to run automatically every day at 02:00 UTC:
  # schedule:
  #   - cron: "0 2 * * *"

# Never run two scrapes at once: they would overwrite each other's files on Mega.
concurrency:
  group: scrape-mega
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright openpyxl
          curl -fsSL https://rclone.org/install.sh | sudo bash
          google-chrome --version

      - name: Configure rclone for Mega
        env:
          MEGA_CONFIG: ${{ secrets.MEGA_CONFIG }}
        run: |
          # MEGA_CONFIG secret = the whole [mega] block (type / user / pass in plain text)
          MUSER=$(printf '%s\n' "$MEGA_CONFIG" | sed -n 's/^[[:space:]]*user[[:space:]]*=[[:space:]]*//p' | head -1 | tr -d '\r' | sed 's/[[:space:]]*$//')
          MPASS=$(printf '%s\n' "$MEGA_CONFIG" | sed -n 's/^[[:space:]]*pass[[:space:]]*=[[:space:]]*//p' | head -1 | tr -d '\r' | sed 's/[[:space:]]*$//')
          if [ -z "$MUSER" ] || [ -z "$MPASS" ]; then
            echo "MEGA_CONFIG secret is missing or has no user/pass lines"; exit 1
          fi
          echo "::add-mask::$MPASS"
          OBSCURED=$(rclone obscure "$MPASS")
          echo "::add-mask::$OBSCURED"
          mkdir -p ~/.config/rclone
          printf '[mega]\ntype = mega\nuser = %s\npass = %s\n' "$MUSER" "$OBSCURED" > ~/.config/rclone/rclone.conf
          rclone lsd mega: >/dev/null && echo "Mega login OK"

      - name: Run scraper
        env:
          MAIN_URLS: ${{ github.event.inputs.main_urls }}
          HOW_MANY: ${{ github.event.inputs.how_many || '500' }}
          CONCURRENCY: "8"
          CLICK_WORKERS: "4"
          PYTHONUNBUFFERED: "1"
        run: python -u scrape.py
